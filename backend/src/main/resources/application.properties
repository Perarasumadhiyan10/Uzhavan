# ===================================================================
# Grain Connect Pro - Backend Configuration
# ===================================================================

spring.application.name=grain-connect-backend
server.port=8080

# -------------------------------------------------------------
# Database - H2 file-based (zero setup, persists to ./data folder)
# Swap to MySQL by commenting the H2 block and uncommenting MySQL block
# -------------------------------------------------------------
# spring.datasource.url=jdbc:h2:file:./data/grainconnect;DB_CLOSE_ON_EXIT=FALSE
# spring.datasource.driver-class-name=org.h2.Driver
# spring.datasource.username=sa
# spring.datasource.password=
# 
# spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# spring.jpa.hibernate.ddl-auto=update
# spring.jpa.show-sql=false
# spring.jpa.properties.hibernate.format_sql=true
# 
# # H2 web console -> http://localhost:8080/h2-console (jdbc url above, user sa, blank password)
# spring.h2.console.enabled=true
# spring.h2.console.path=/h2-console

# -------------------------------------------------------------
# MySQL alternative (uncomment & fill in, then comment out H2 block above)
# -------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/grainconnect?createDatabaseIfNotExist=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=Pass@10052006
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# -------------------------------------------------------------
# JWT
# -------------------------------------------------------------
# 256-bit secret used to sign tokens - change this for production!
app.jwt.secret=ChangeThisGrainConnectProSuperSecretKeyForJWTSigning32B+
app.jwt.expiration-ms=86400000

# -------------------------------------------------------------
# CORS - allow the Vite dev server / deployed frontend
# -------------------------------------------------------------
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000,http://localhost:8081

# -------------------------------------------------------------
# Reservation expiry scheduler (runs every minute)
# -------------------------------------------------------------
app.reservation.expiry-hours=24
